x-logging: &logging
  driver: local

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --maxmemory 64mb --maxmemory-policy volatile-lru
    volumes:
      - valkey:/data
    logging: *logging
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.dockerfile
    env_file: .env
    command: >
      granian --interface wsgi --host 0.0.0.0 --workers 1 --backpressure 16
      --respawn-failed-workers --workers-max-rss 256 cfg.wsgi:application
    sysctls:
      net.ipv4.tcp_migrate_req: 1
    volumes:
      - static:/app/staticfiles
    logging: *logging
    restart: unless-stopped
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000))"]
      interval: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/backend.dockerfile
    env_file: .env
    command: python manage.py procrastinate worker --concurrency 6
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    mem_limit: 396m
    logging: *logging
    restart: unless-stopped
    cap_drop: [ALL]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.dockerfile
    volumes:
      - site:/out
    logging: *logging
    restart: "no"
    cap_drop: [ALL]

  caddy:
    build:
      context: .
      dockerfile: caddy.dockerfile
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - site:/srv/site:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  pgdata:
  valkey:
  site:
  static:
  caddy_data:
  caddy_config:

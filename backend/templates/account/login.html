{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in to Iris</h1>
<div class="box">
  <div class="box-body">
    <p class="muted">Sign in with Google to manage your plugins and inbox access.</p>
    <a class="btn btn-block" href="{% url 'google_login' %}">Continue with Google</a>
  </div>
</div>
<div class="foot">New to Iris? Signing in with Google creates your account.</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in to Iris</h1>
<div class="box">
  <div class="box-body">
    <p class="muted">Sign in with Google to manage your plugins and inbox access.</p>
    <a class="btn btn-primary btn-block" href="{% url 'google_login' %}{% if redirect_field_value %}?{{ redirect_field_name }}={{ redirect_field_value|urlencode }}{% endif %}">Continue with Google</a>
  </div>
</div>
{% endblock %}

[project]
name = "backend"
version = "0.1.0"
description = "Iris backend: Gmail polling, Laya extraction and the plugin API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-allauth>=65.20.1",
    "djangorestframework>=3.18.3",
    "granian>=2.8.5",
    "laya==0.4.15",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "redis[hiredis]>=8.1.0",
    "torch",
    "simplegmail==5.0.0",
    "uuid6>=2025.0.1",
    "pyjwt[crypto]>=2.0",
    "drf-spectacular>=0.30.0",
    "django-cacheops>=7.2",
    "python-json-logger>=4.2.0",
    "django-otp>=1.7.5",
    "django-fernet-encrypted-fields>=0.4.0",
    "google-re2==1.1.20251105",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]

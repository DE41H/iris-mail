name: build
on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, docker/**, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: touch docker/.env
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v6
        with:
          source: .
          workdir: docker
          files: docker-compose.yml
          targets: backend,frontend,caddy
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            caddy.cache-from=type=gha,scope=caddy
            caddy.cache-to=type=gha,scope=caddy,mode=max
